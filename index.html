<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathSoc Black Jack Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Left Side: Form Panel -->
        <section class="panel form-panel">
            <div class="brand-header">
                <img src="mathsoc.png" alt="MathSoc Logo" class="logo">
                <div>
                    <h1>Black Jack</h1>
                    <p class="subtitle">MathSoc Leaderboard</p>
                </div>
            </div>
            
            <form id="score-form" class="score-form">
                <h2>Add New Score</h2>
                
                <div class="input-group">
                    <label for="player-name">Player Name</label>
                    <input type="text" id="player-name" placeholder="John Doe" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="entry-number">Entry Number</label>
                    <input type="text" id="entry-number" placeholder="2023CS10111" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="insta-handle">Instagram Handle (Optional)</label>
                    <input type="text" id="insta-handle" placeholder="@johndoe" autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="player-score">Final Score</label>
                    <input type="number" id="player-score" placeholder="21" required autocomplete="off">
                </div>
                
                <button type="submit" class="primary-btn gold-btn">Submit Score</button>
            </form>
        </section>

        <!-- Right Side: Leaderboard Panel -->
        <section class="panel leaderboard-panel">
            <div class="leaderboard-header">
                <h2>Top Players</h2>
                <button id="clear-btn" class="danger-btn-small">Reset All</button>
            </div>
            
            <div class="leaderboard-list-container">
                <ul id="leaderboard-list">
                    <!-- Leaderboard entries injected via JS -->
                </ul>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
